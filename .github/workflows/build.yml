name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: coating-imaging-macos-arm64
            extension: tar.gz
            machine: arm64
          - os: windows-latest
            artifact: coating-imaging-windows-x64
            extension: zip
            machine: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7'
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build application
        run: 'python -m PyInstaller --noconfirm --clean --onedir --windowed --name CoatingImaging --hidden-import pipeline --add-data "PACKAGED_README.html:." converter_gui.py'
      - name: Assemble package
        run: python scripts/package_desktop.py ${{ matrix.artifact }}
      - name: Test extracted application
        run: python scripts/check_package.py ${{ matrix.artifact }}.${{ matrix.extension }} ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.artifact }}
          path: build/package-smoke.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coating-imaging-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

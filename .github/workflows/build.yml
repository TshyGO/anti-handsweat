name: Build desktop packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: coating-imaging-macos-arm64
          - os: windows-latest
            artifact: coating-imaging-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name CoatingImaging converter_gui.py
      - name: Assemble package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package/imagej package/demo package/docs
          cp -R imagej/. package/imagej/
          cp -R demo/. package/demo/
          cp README.md CHANGELOG.md VALIDATION.md requirements.txt package/docs/
          cp -R dist/CoatingImaging/. package/CoatingImaging/
          tar -czf '${{ matrix.artifact }}.tar.gz' -C package .
      - name: Assemble package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/imagej,package/demo,package/docs | Out-Null
          Copy-Item imagej/* package/imagej -Recurse
          Copy-Item demo/* package/demo -Recurse
          Copy-Item README.md,CHANGELOG.md,VALIDATION.md,requirements.txt package/docs
          Copy-Item dist/CoatingImaging/* package/CoatingImaging -Recurse
          Compress-Archive -Path package/* -DestinationPath '${{ matrix.artifact }}.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.*
